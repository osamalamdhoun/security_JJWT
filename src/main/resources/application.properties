spring.application.name=security-demo2
server.port=8080

# Local PostgreSQL: first create security_demo using pgAdmin (see README).
spring.datasource.url=jdbc:postgresql://localhost:5432/security_demo
spring.datasource.username=postgres
spring.datasource.password=198137
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Reject unexpected request fields, including attempts to register with a role.
spring.jackson.deserialization.fail-on-unknown-properties=true

# JJWT: Base64-encoded key of at least 32 bytes for HS256.
# PUBLIC DEMO KEY ONLY. Replace with a private random key before real use.
app.jwt.secret=MjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMw==
app.jwt.issuer=security-demo2
app.jwt.expiration=1h

# Local learning accounts only. Set false to stop creating accounts at startup.
# Existing accounts are not reset or deleted when these settings change.
app.demo.enabled=true
app.demo.user-email=user@example.com
app.demo.user-password=User12345!
app.demo.manager-email=manager@example.com
app.demo.manager-password=Manager12345!
app.demo.admin-email=admin@example.com
app.demo.admin-password=Admin12345!
